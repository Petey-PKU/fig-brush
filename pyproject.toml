[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fig-brush"
version = "0.3.2"
description = "Create editable Origin figure templates from reference screenshots"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Petey Yu"}]
requires-python = ">=3.10"
keywords = ["origin", "scientific-figures", "mcp", "skill", "templates"]
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "scipy>=1.10",
  "jsonschema>=4.0",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6", "build>=1", "tomli>=2; python_version < '3.11'"]

[project.scripts]
fig-brush = "fig_brush.__main__:main"

[tool.setuptools]
packages = ["fig_brush", "mcp_server", "origin_bridge", "plot_specs", "templates"]
include-package-data = false

[tool.setuptools.package-data]
plot_specs = ["*.json", "graph_families/*.json"]
templates = ["origin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


